<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Pawgram</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
body{margin:0;background:#FBF3E9;font-family:'Figtree',sans-serif;color:#3A2E26}
a{color:#D9784F;text-decoration:none}
a.navitem,a.plain{color:#3A2E26;text-decoration:none}
.navitem{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;color:#3A2E26}
.navitem.active{background:#F6E3D6;color:#D9784F}
.btn{border:none;border-radius:999px;font-family:'Figtree',sans-serif;font-weight:600;cursor:pointer}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.04)}

#explore-dropdown{display:none;position:fixed;background:#fff;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:12px;width:240px;z-index:1000}

@media (max-width: 860px) {
  #app-shell { flex-direction: column !important; }
  #left-sidebar {
    width: 100% !important;
    flex: none !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 4px !important;
    padding: 10px 12px !important;
    border-right: none !important;
    border-bottom: 1px solid #EAE0D2 !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 10 !important;
    background: #FBF3E9 !important;
  }
  #left-sidebar .logo { padding: 8px 10px 8px 4px !important; flex: none !important; }
  #left-sidebar .navitem { padding: 8px 10px !important; flex: none !important; }
  #left-sidebar #explore-wrap,
  #left-sidebar #logout-link { margin-top: 0 !important; flex: none !important; }
  #main-col { padding: 16px !important; }
}
@media (max-width: 420px) {
  #left-sidebar .navitem span.nav-label { display: none; }
  #left-sidebar #logout-link { padding: 8px 12px !important; font-size: 12px !important; }
}
</style>

</head>
<body>

<div id="app-shell" style="display:flex;max-width:1320px;margin:0 auto;min-height:100vh">

  <!-- LEFT SIDEBAR -->
  <div id="left-sidebar" style="width:230px;flex:0 0 230px;padding:28px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #EAE0D2">
    <div class="logo" style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;padding:8px 16px 24px;color:#3A2E26">Pawgram</div>
    <a href="feed.html" class="navitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="nav-label">Home</span></a>
    <div id="explore-wrap" style="position:relative">
      <a href="#" id="explore-toggle" class="navitem active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span class="nav-label">Explore</span></a>
      <div id="explore-dropdown">
        <form id="explore-form" style="display:flex;gap:8px">
          <input id="explore-input" type="text" placeholder="Search people or posts…" autocomplete="off" style="flex:1;min-width:0;padding:10px 12px;border:2px solid #E3D6C6;border-radius:10px;font-size:14px;font-family:'Figtree',sans-serif;outline:none">
          <button type="submit" class="btn" style="background:#D9784F;color:#fff;padding:10px 14px;font-size:13px;flex:none">Go</button>
        </form>
      </div>
    </div>
    <div class="navitem" style="opacity:.5;cursor:default"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 12c-2.5 4.4-9.5 9-9.5 9z"/></svg><span class="nav-label">Playdates</span></div>
    <div class="navitem" style="opacity:.5;cursor:default"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="nav-label">Messages</span></div>
    <a href="#" id="profile-link" class="navitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="nav-label">Profile</span></a>
    <a href="#" id="logout-link" class="plain" style="margin-top:auto;padding:12px 16px;font-size:13px;color:#A6927C"><span class="nav-label">Log out</span></a>
  </div>

  <!-- MAIN -->
  <div id="main-col" style="flex:1 1 auto;min-width:0;padding:28px 28px;display:flex;flex-direction:column;gap:20px">

    <div class="card" style="padding:18px 22px">
      <form id="page-search-form" style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="page-search-input" type="text" placeholder="Search people or posts…" autocomplete="off" style="flex:1;min-width:160px;padding:12px 16px;border:2px solid #E3D6C6;border-radius:999px;font-size:15px;font-family:'Figtree',sans-serif;outline:none">
        <button type="submit" class="btn" style="background:#D9784F;color:#fff;padding:12px 24px;font-size:14px">Search</button>
      </form>
    </div>

    <div id="search-heading" style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;color:#3A2E26"></div>

    <div id="empty-state" class="card" style="display:none;padding:32px;text-align:center;color:#A6927C">
      Search for a username, or a word from someone's post.
    </div>

    <div id="results-wrap" style="display:none;flex-direction:column;gap:24px">
      <div>
        <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#3A2E26;margin-bottom:10px">People</div>
        <div id="people-results" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
      <div>
        <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#3A2E26;margin-bottom:10px">Posts</div>
        <div id="posts-results" style="display:flex;flex-direction:column;gap:16px"></div>
      </div>
    </div>

  </div>

</div>

<script>
let session, me;

function getQueryFromURL() {
  return new URLSearchParams(window.location.search).get('q') || '';
}

// Escapes ILIKE wildcard characters in free-typed search text so a literal
// "%" or "_" in someone's query doesn't act as a SQL wildcard.
function escapeLikePattern(term) {
  return term.replace(/[%_]/g, (m) => '\\' + m);
}

function renderPeople(people, box) {
  if (people.length === 0) {
    box.innerHTML = '<div class="card" style="padding:18px 20px;color:#A6927C;font-size:14px">No matching people found.</div>';
    return;
  }
  box.innerHTML = people.map(p => `
    <a href="profile.html?u=${encodeURIComponent(p.username)}" class="card plain" style="padding:14px 20px;display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:50%;background:#6B9080;flex:0 0 44px"></div>
      <div>
        <div style="font-weight:600;color:#3A2E26">${escapeHtml(p.display_name || p.username)}</div>
        <div style="font-size:13px;color:#A6927C">@${escapeHtml(p.username)}</div>
      </div>
    </a>`).join('');
}

function renderPosts(posts, box) {
  if (posts.length === 0) {
    box.innerHTML = '<div class="card" style="padding:18px 20px;color:#A6927C;font-size:14px">No matching posts found.</div>';
    return;
  }
  box.innerHTML = posts.map(p => {
    const name = p.author?.display_name || p.author?.username || 'Someone';
    const uname = p.author?.username || '';
    const images = (p.post_images || []).slice().sort((a, b) => a.position - b.position);
    const imageHtml = images.length
      ? `<img src="${getPostImageUrl(images[0].storage_path)}" loading="lazy" decoding="async" style="width:100%;max-height:360px;object-fit:cover;display:block;background:#EFE3D2">`
      : '';
    return `
      <div class="card" style="padding:0;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:16px 20px">
          <div style="width:38px;height:38px;border-radius:50%;background:#D9784F;flex:0 0 38px"></div>
          <div>
            <a href="profile.html?u=${encodeURIComponent(uname)}" style="font-weight:600;font-size:14px;color:#3A2E26">${escapeHtml(name)}</a>
            <div style="font-size:12px;color:#A6927C">${timeAgo(p.created_at)}</div>
          </div>
        </div>
        ${imageHtml}
        ${p.caption ? `<div style="padding:14px 20px;font-size:14px;color:#3A2E26;white-space:pre-wrap">${escapeHtml(p.caption)}</div>` : ''}
      </div>`;
  }).join('');
}

async function runSearch(term) {
  document.getElementById('search-heading').textContent = `Search results for "${term}"`;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results-wrap').style.display = 'flex';

  const peopleBox = document.getElementById('people-results');
  const postsBox = document.getElementById('posts-results');
  const peopleTimer = startElapsedPlaceholder(peopleBox, 'Searching people…');
  const postsTimer = startElapsedPlaceholder(postsBox, 'Searching posts…');

  const pattern = `%${escapeLikePattern(term)}%`;

  try {
    const [byUsername, byDisplayName] = await Promise.all([
      supabaseClient.from('profiles').select('id, username, display_name').ilike('username', pattern).limit(20),
      supabaseClient.from('profiles').select('id, username, display_name').ilike('display_name', pattern).limit(20)
    ]);

    if (byUsername.error || byDisplayName.error) {
      throw new Error((byUsername.error || byDisplayName.error).message);
    }

    const peopleMap = new Map();
    for (const row of [...(byUsername.data || []), ...(byDisplayName.data || [])]) {
      peopleMap.set(row.id, row);
    }
    const people = [...peopleMap.values()].filter(p => p.id !== me.id);
    renderPeople(people, peopleBox);
  } catch (err) {
    peopleBox.innerHTML = `<div class="card" style="padding:18px 20px;color:#C0392B">Couldn't search people: ${escapeHtml(err.message)}</div>`;
  } finally {
    clearInterval(peopleTimer);
  }

  try {
    const { data: posts, error } = await supabaseClient
      .from('posts')
      .select('id, caption, created_at, author_id, author:profiles!posts_author_id_fkey(username, display_name), post_images(storage_path, position)')
      .ilike('caption', pattern)
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) throw new Error(error.message);
    renderPosts(posts || [], postsBox);
  } catch (err) {
    postsBox.innerHTML = `<div class="card" style="padding:18px 20px;color:#C0392B">Couldn't search posts: ${escapeHtml(err.message)}</div>`;
  } finally {
    clearInterval(postsTimer);
  }
}

async function init() {
  session = await requireSession();
  if (!session) return;

  me = await getMyProfile(session);
  if (!me) return;

  document.getElementById('profile-link').href = 'profile.html?u=' + encodeURIComponent(me.username);
  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    logout();
  });
  initExploreDropdown();

  const initialQuery = getQueryFromURL();
  document.getElementById('page-search-input').value = initialQuery;

  document.getElementById('page-search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('page-search-input').value.trim();
    if (!q) return;
    const url = new URL(window.location.href);
    url.searchParams.set('q', q);
    window.history.replaceState({}, '', url);
    runSearch(q);
  });

  if (initialQuery) {
    await runSearch(initialQuery);
  } else {
    document.getElementById('empty-state').style.display = 'block';
  }
}

init();
</script>

</body>
</html>
