<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Pawgram</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{margin:0;background:linear-gradient(160deg,#FBF3E9 0%,#F8E7D6 45%,#F3DCC6 100%);font-family:'Figtree',sans-serif;color:#3A2E26;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;position:relative;overflow-x:hidden}

.bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-decor .blob{position:absolute;border-radius:50%;filter:blur(50px)}
.bg-decor .blob1{width:360px;height:360px;background:#6B908030;top:-110px;left:-90px}
.bg-decor .blob2{width:420px;height:420px;background:#D9784F2b;bottom:-140px;right:-110px}
.bg-decor .blob3{width:260px;height:260px;background:#F2C85433;top:40%;left:46%}
.floaty{position:absolute;animation:bob 4.5s ease-in-out infinite;opacity:.9;filter:drop-shadow(0 6px 10px rgba(58,46,38,.08))}
.spin-paw{animation:spinwag 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(var(--r,0deg))}}
@keyframes spinwag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

.card{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:40px;width:100%;max-width:400px;box-sizing:border-box;position:relative;z-index:1}
.logo{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;text-align:center;margin-bottom:8px;color:#3A2E26;text-decoration:none}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;text-align:center;margin:0 0 28px;color:#3A2E26}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#3A2E26}
input{width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #E3D6C6;border-radius:12px;font-size:15px;font-family:'Figtree',sans-serif;margin-bottom:18px;outline:none}
input:focus{border-color:#D9784F}
button{width:100%;background:#D9784F;color:#fff;border:none;border-radius:999px;padding:14px;font-size:16px;font-weight:600;font-family:'Figtree',sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;margin-top:14px;text-align:center}
.msg.error{color:#C0392B}
.msg.success{color:#2E7D32}
.foot{text-align:center;margin-top:20px;font-size:14px;color:#6B5E54}
.foot a{color:#D9784F;text-decoration:none;font-weight:600}
@media (max-width: 420px) {
  body { padding: 16px; }
  .card { padding: 28px 22px; }
  .floaty { transform: scale(.8); }
}
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <span class="floaty" style="top:8%;left:10%;font-size:40px;--r:-10deg;animation-delay:0s">🐶</span>
  <span class="floaty" style="top:16%;right:12%;font-size:34px;--r:8deg;animation-delay:.8s">🐱</span>
  <span class="floaty" style="bottom:14%;left:14%;font-size:36px;--r:6deg;animation-delay:1.4s">🐰</span>
  <span class="floaty" style="bottom:22%;right:9%;font-size:32px;--r:-6deg;animation-delay:.4s">🐾</span>
  <span class="floaty spin-paw" style="top:44%;left:4%;font-size:26px;animation-delay:1.1s">🐾</span>
  <span class="floaty spin-paw" style="top:38%;right:5%;font-size:24px;animation-delay:1.9s">🦴</span>
  <span class="floaty" style="top:6%;left:46%;font-size:22px;--r:4deg;animation-delay:2.2s">✨</span>
</div>

<div class="card">
  <a href="index.html" class="logo">🐾 Pawgram</a>
  <h1>Welcome back</h1>

  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="submit-btn" type="submit">Log in</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="foot">New to Pawgram? <a href="signup.html">Sign up</a></div>
</div>

<script>
const form = document.getElementById('login-form');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submit-btn');

function showMessage(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL") {
    showMessage('Supabase isn\'t configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in config.js.', 'error');
    return;
  }

  submitBtn.disabled = true;
  showMessage('Logging in…', '');

  const syntheticEmail = `${username}@pawgram-users.com`;
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: syntheticEmail,
    password
  });

  if (error) {
    showMessage('Incorrect username or password.', 'error');
    submitBtn.disabled = false;
    return;
  }

  showMessage('Welcome back! Redirecting…', 'success');
  setTimeout(() => { window.location.href = 'feed.html'; }, 800);
});
</script>

</body>
</html>
