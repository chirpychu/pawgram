<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Pawgram</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{margin:0;background:linear-gradient(160deg,#FBF3E9 0%,#F8E7D6 45%,#F3DCC6 100%);font-family:'Figtree',sans-serif;color:#3A2E26;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;position:relative;overflow-x:hidden}

.bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-decor .blob{position:absolute;border-radius:50%;filter:blur(50px)}
.bg-decor .blob1{width:360px;height:360px;background:#D9784F2b;top:-110px;right:-90px}
.bg-decor .blob2{width:420px;height:420px;background:#6B908030;bottom:-140px;left:-110px}
.bg-decor .blob3{width:260px;height:260px;background:#F2C85433;top:42%;right:44%}
.floaty{position:absolute;animation:bob 4.5s ease-in-out infinite;opacity:.9;filter:drop-shadow(0 6px 10px rgba(58,46,38,.08))}
.spin-paw{animation:spinwag 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(var(--r,0deg))}}
@keyframes spinwag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

.card{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:40px;width:100%;max-width:400px;box-sizing:border-box;position:relative;z-index:1}
.logo{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;text-align:center;margin-bottom:8px;color:#3A2E26;text-decoration:none}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;text-align:center;margin:0 0 28px;color:#3A2E26}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#3A2E26}
input{width:100%;box-sizing:border-box;padding:12px 14px;border:2px solid #E3D6C6;border-radius:12px;font-size:15px;font-family:'Figtree',sans-serif;margin-bottom:18px;outline:none}
input:focus{border-color:#D9784F}
button{width:100%;background:#D9784F;color:#fff;border:none;border-radius:999px;padding:14px;font-size:16px;font-weight:600;font-family:'Figtree',sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;margin-top:14px;text-align:center}
.msg.error{color:#C0392B}
.msg.success{color:#2E7D32}
.foot{text-align:center;margin-top:20px;font-size:14px;color:#6B5E54}
.foot a{color:#D9784F;text-decoration:none;font-weight:600}
@media (max-width: 420px) {
  body { padding: 16px; }
  .card { padding: 28px 22px; }
  .floaty { transform: scale(.8); }
}
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <span class="floaty" style="top:10%;right:11%;font-size:40px;--r:8deg;animation-delay:0s">🐱</span>
  <span class="floaty" style="top:18%;left:9%;font-size:34px;--r:-8deg;animation-delay:.8s">🐶</span>
  <span class="floaty" style="bottom:16%;right:13%;font-size:36px;--r:-6deg;animation-delay:1.4s">🐹</span>
  <span class="floaty" style="bottom:24%;left:8%;font-size:32px;--r:6deg;animation-delay:.4s">🐾</span>
  <span class="floaty spin-paw" style="top:46%;right:4%;font-size:26px;animation-delay:1.1s">🐾</span>
  <span class="floaty spin-paw" style="top:36%;left:5%;font-size:24px;animation-delay:1.9s">🦴</span>
  <span class="floaty" style="top:6%;right:46%;font-size:22px;--r:-4deg;animation-delay:2.2s">✨</span>
</div>

<div class="card">
  <a href="index.html" class="logo">🐾 Pawgram</a>
  <h1>Join the pack</h1>

  <form id="signup-form">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only" required>
    <div style="font-size:12px;color:#A6927C;margin:-12px 0 18px">This is what you'll use to log in — keep it handy.</div>

    <label for="display-name">Display name</label>
    <input id="display-name" type="text" autocomplete="nickname" minlength="1" maxlength="40" placeholder="e.g. Milo the Golden" required>
    <div style="font-size:12px;color:#A6927C;margin:-12px 0 18px">This is the name shown on your profile and posts — change it anytime.</div>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="6" required>

    <button id="submit-btn" type="submit">Sign up</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="foot">Already on Pawgram? <a href="login.html">Log in</a></div>
</div>

<script>
const form = document.getElementById('signup-form');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submit-btn');

function showMessage(text, type) {
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const displayName = document.getElementById('display-name').value.trim();
  const password = document.getElementById('password').value;

  if (SUPABASE_URL === "YOUR_SUPABASE_PROJECT_URL") {
    showMessage('Supabase isn\'t configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in config.js.', 'error');
    return;
  }

  submitBtn.disabled = true;
  showMessage('Creating your account…', '');

  // check the username isn't already taken
  const { data: existing, error: lookupError } = await supabaseClient
    .from('profiles')
    .select('username')
    .eq('username', username)
    .maybeSingle();

  if (lookupError) {
    showMessage('Something went wrong checking that username. Try again.', 'error');
    submitBtn.disabled = false;
    return;
  }
  if (existing) {
    showMessage('That username is already taken.', 'error');
    submitBtn.disabled = false;
    return;
  }

  // Supabase Auth needs an email, so we generate a private one behind the
  // scenes and store the real username in the user's metadata + profiles row.
  const syntheticEmail = `${username}@pawgram-users.com`;

  const { data, error } = await supabaseClient.auth.signUp({
    email: syntheticEmail,
    password,
    options: { data: { username, display_name: displayName } }
  });

  if (error) {
    showMessage(error.message, 'error');
    submitBtn.disabled = false;
    return;
  }

  showMessage('Account created! Redirecting…', 'success');
  setTimeout(() => { window.location.href = 'feed.html'; }, 1200);
});
</script>

</body>
</html>
