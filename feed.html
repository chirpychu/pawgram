<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawgram Feed</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1791515810"></script>
<script src="auth.js?v=1791515810"></script>
<style>
body{margin:0;background:#FBF3E9;font-family:'Figtree',sans-serif;color:#3A2E26}
a{color:#D9784F;text-decoration:none}
a.navitem,a.plain{color:#3A2E26;text-decoration:none}
.navitem{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;color:#3A2E26}
.navitem.active{background:#F6E3D6;color:#D9784F}
.btn{border:none;border-radius:999px;font-family:'Figtree',sans-serif;font-weight:600;cursor:pointer}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.04)}

#explore-dropdown{display:none;position:fixed;background:#fff;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:12px;width:240px;z-index:1000}

@media (max-width: 860px) {
  #app-shell { flex-direction: column !important; }
  #left-sidebar {
    width: 100% !important;
    flex: none !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 4px !important;
    padding: 10px 12px !important;
    border-right: none !important;
    border-bottom: 1px solid #EAE0D2 !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 10 !important;
    background: #FBF3E9 !important;
  }
  #left-sidebar .logo { padding: 8px 10px 8px 4px !important; flex: none !important; }
  #left-sidebar .navitem { padding: 8px 10px !important; flex: none !important; }
  #left-sidebar #explore-wrap,
  #left-sidebar #sidebar-new-post,
  #left-sidebar #logout-link { margin-top: 0 !important; flex: none !important; }
  #center-col { padding: 16px !important; }
  #right-sidebar { width: 100% !important; flex: none !important; padding: 0 16px 16px !important; }
  /* the top bar's Profile icon already covers this, so hide the
     duplicate "View your profile" card on small screens */
  #my-profile-card { display: none !important; }
  .composer-indent { padding-left: 0 !important; }
}
@media (max-width: 420px) {
  #left-sidebar .navitem span.nav-label { display: none; }
  #left-sidebar #sidebar-new-post,
  #left-sidebar #logout-link { padding: 8px 12px !important; font-size: 12px !important; }
}
</style>

</head>
<body>



<div id="app-shell" style="display:flex;max-width:1320px;margin:0 auto;min-height:100vh">

  <!-- LEFT SIDEBAR -->
  <div id="left-sidebar" style="width:230px;flex:0 0 230px;padding:28px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #EAE0D2">
    <div class="logo" style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;padding:8px 16px 24px;color:#3A2E26">Pawgram</div>
    <a href="feed" class="navitem active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="nav-label">Home</span></a>
    <div id="explore-wrap" style="position:relative">
      <a href="#" id="explore-toggle" class="navitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><span class="nav-label">Explore</span></a>
      <div id="explore-dropdown">
        <form id="explore-form" style="display:flex;gap:8px">
          <input id="explore-input" type="text" placeholder="Search people or posts…" autocomplete="off" style="flex:1;min-width:0;padding:10px 12px;border:2px solid #E3D6C6;border-radius:10px;font-size:14px;font-family:'Figtree',sans-serif;outline:none">
          <button type="submit" class="btn" style="background:#D9784F;color:#fff;padding:10px 14px;font-size:13px;flex:none">Go</button>
        </form>
      </div>
    </div>
    <div class="navitem" style="opacity:.5;cursor:default"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 12c-2.5 4.4-9.5 9-9.5 9z"/></svg><span class="nav-label">Playdates</span></div>
    <div class="navitem" style="opacity:.5;cursor:default"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="nav-label">Messages</span></div>
    <a href="#" id="profile-link" class="navitem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="nav-label">Profile</span></a>
    <button id="sidebar-new-post" class="btn" style="margin-top:20px;background:#D9784F;color:#fff;padding:14px;font-size:15px"><span class="nav-label">+ New post</span></button>
    <a href="#" id="logout-link" class="plain" style="margin-top:auto;padding:12px 16px;font-size:13px;color:#A6927C"><span class="nav-label">Log out</span></a>
  </div>

  <!-- CENTER FEED -->
  <div id="center-col" style="flex:1 1 auto;min-width:0;padding:28px 28px;display:flex;flex-direction:column;gap:20px">

    <div class="card" style="padding:18px 22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:50%;background:#6B9080;flex:0 0 44px"></div>
        <input id="composer-input" type="text" placeholder="Share something…" style="flex:1;min-width:0;background:#FBF3E9;border:none;border-radius:999px;padding:12px 18px;color:#3A2E26;font-size:15px;font-family:'Figtree',sans-serif;outline:none">
        <button id="post-btn" class="btn" style="background:#D9784F;color:#fff;padding:10px 20px;font-size:14px">Post</button>
      </div>
      <div id="composer-preview-wrap" class="composer-indent" style="display:none;align-items:center;gap:12px;padding-left:58px">
        <img id="composer-preview" style="width:72px;height:72px;object-fit:cover;border-radius:12px">
        <button id="composer-remove-image" class="btn" style="background:#FBF3E9;color:#3A2E26;padding:7px 14px;font-size:13px">Remove photo</button>
      </div>
      <div class="composer-indent" style="display:flex;align-items:center;gap:12px;padding-left:58px;flex-wrap:wrap">
        <label for="composer-file" class="btn" style="background:#FBF3E9;color:#D9784F;padding:8px 16px;font-size:13px;cursor:pointer">📷 Add a photo of your pet</label>
        <input id="composer-file" type="file" accept="image/*" style="display:none">
        <div id="composer-error" style="font-size:13px;color:#C0392B"></div>
      </div>
    </div>

    <div id="feed-list" style="display:flex;flex-direction:column;gap:20px">
      <div class="card" style="padding:32px;text-align:center;color:#A6927C">Loading your feed…</div>
    </div>

  </div>

  <!-- RIGHT SIDEBAR -->
  <div id="right-sidebar" style="width:280px;flex:0 0 280px;padding:28px 16px;display:flex;flex-direction:column;gap:20px">

    <a href="#" id="my-profile-card" class="card plain" style="padding:20px;text-align:center;display:block">
      <div style="width:64px;height:64px;border-radius:50%;background:#D9784F;margin:0 auto 12px"></div>
      <div id="my-name" style="font-weight:600;font-size:16px">…</div>
      <div style="font-size:13px;color:#A6927C">View your profile</div>
    </a>

    <div class="card" style="padding:20px">
      <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;margin-bottom:14px">Upcoming playdates</div>
      <div style="font-size:13px;color:#A6927C">No playdates yet — this is coming soon.</div>
    </div>

    <div class="card" style="padding:20px">
      <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;margin-bottom:14px">Suggested for you</div>
      <div id="suggestions-list" style="display:flex;flex-direction:column;gap:14px">
        <div style="font-size:13px;color:#A6927C">Loading…</div>
      </div>
    </div>

  </div>

</div>

<script>
let session, me;

async function loadFeed() {
  const feedList = document.getElementById('feed-list');
  const timer = startElapsedPlaceholder(feedList, 'Loading your feed…');

  try {
    const { data: follows, error: followsError } = await supabaseClient
      .from('follows')
      .select('following_id')
      .eq('follower_id', me.id);

    if (followsError) {
      feedList.innerHTML = `<div class="card" style="padding:24px;color:#C0392B">Couldn't load the feed: ${escapeHtml(followsError.message)}</div>`;
      return;
    }

    const authorIds = [me.id, ...follows.map(f => f.following_id)];

    const { data: posts, error: postsError } = await supabaseClient
      .from('posts')
      .select('id, caption, location, created_at, author_id, author:profiles!posts_author_id_fkey(username, display_name), post_images(storage_path, position)')
      .in('author_id', authorIds)
      .order('created_at', { ascending: false })
      .limit(30);

    if (postsError) {
      feedList.innerHTML = `<div class="card" style="padding:24px;color:#C0392B">Couldn't load the feed: ${escapeHtml(postsError.message)}</div>`;
      return;
    }

    if (!posts || posts.length === 0) {
      feedList.innerHTML = `
        <div class="card" style="padding:32px;text-align:center">
          <div style="font-size:17px;font-weight:600;margin-bottom:8px;color:#3A2E26">No posts yet</div>
          <div style="font-size:14px;color:#6B5E54">Follow a few pet parents on the right to see their posts here — or share your own above.</div>
        </div>`;
      return;
    }

    feedList.innerHTML = posts.map(renderPost).join('');

    feedList.querySelectorAll('.delete-post-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this post?')) return;
        btn.disabled = true;
        const { error } = await supabaseClient.from('posts').delete().eq('id', btn.dataset.id);
        if (error) {
          alert("Couldn't delete: " + error.message);
          btn.disabled = false;
          return;
        }
        loadFeed();
      });
    });
  } catch (err) {
    feedList.innerHTML = `<div class="card" style="padding:24px;color:#C0392B">Something went wrong: ${escapeHtml(err.message)}</div>`;
  } finally {
    clearInterval(timer);
  }
}

function renderPost(p) {
  const name = p.author?.display_name || p.author?.username || 'Someone';
  const uname = p.author?.username || '';
  const meta = timeAgo(p.created_at) + (p.location ? ' · ' + escapeHtml(p.location) : '');
  const deleteBtnHtml = p.author_id === me.id
    ? `<button class="delete-post-btn" data-id="${p.id}" title="Delete post" style="margin-left:auto;background:none;border:none;cursor:pointer;color:#A6927C;font-size:13px;padding:6px">✕</button>`
    : '';
  const images = (p.post_images || []).slice().sort((a, b) => a.position - b.position);
  const imageHtml = images.length
    ? `<img src="${getPostImageUrl(images[0].storage_path)}" loading="lazy" decoding="async" style="width:100%;max-height:520px;object-fit:cover;display:block;background:#EFE3D2">`
    : '';
  return `
    <div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:18px 22px">
        <div style="width:42px;height:42px;border-radius:50%;background:#D9784F;flex:0 0 42px"></div>
        <div>
          <a href="profile?u=${encodeURIComponent(uname)}" style="font-weight:600;font-size:15px;color:#3A2E26">${escapeHtml(name)}</a>
          <div style="font-size:13px;color:#A6927C">${meta}</div>
        </div>
        ${deleteBtnHtml}
      </div>
      ${imageHtml}
      ${p.caption ? `<div style="padding:16px 22px;font-size:15px;color:#3A2E26;white-space:pre-wrap">${escapeHtml(p.caption)}</div>` : ''}
    </div>`;
}

async function loadSuggestions() {
  const box = document.getElementById('suggestions-list');

  const { data: follows } = await supabaseClient.from('follows').select('following_id').eq('follower_id', me.id);
  const followingIds = new Set((follows || []).map(f => f.following_id));

  const { data: profiles, error } = await supabaseClient
    .from('profiles')
    .select('id, username, display_name')
    .neq('id', me.id)
    .limit(25);

  if (error) {
    box.innerHTML = `<div style="font-size:13px;color:#C0392B">${escapeHtml(error.message)}</div>`;
    return;
  }

  const suggestions = profiles.filter(p => !followingIds.has(p.id)).slice(0, 5);

  if (suggestions.length === 0) {
    box.innerHTML = '<div style="font-size:13px;color:#A6927C">No one new to suggest yet.</div>';
    return;
  }

  box.innerHTML = suggestions.map(p => `
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:50%;background:#6B9080;flex:0 0 36px"></div>
      <a href="profile?u=${encodeURIComponent(p.username)}" style="flex:1;font-size:14px;font-weight:500;color:#3A2E26">${escapeHtml(p.display_name || p.username)}</a>
      <button class="btn follow-btn" data-id="${p.id}" style="background:#FBF3E9;color:#D9784F;padding:6px 14px;font-size:13px">Follow</button>
    </div>`).join('');

  box.querySelectorAll('.follow-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const { error } = await supabaseClient.from('follows').insert({ follower_id: me.id, following_id: btn.dataset.id });
      if (error) {
        btn.disabled = false;
        return;
      }
      btn.textContent = 'Following';
      loadFeed();
    });
  });
}

let selectedFile = null;

function setComposerError(msg) {
  document.getElementById('composer-error').textContent = msg || '';
}

function resetComposerImage() {
  selectedFile = null;
  document.getElementById('composer-file').value = '';
  document.getElementById('composer-preview-wrap').style.display = 'none';
}

async function createPost() {
  const input = document.getElementById('composer-input');
  const caption = input.value.trim();

  if (!selectedFile) {
    setComposerError('Add a photo of your pet before posting — photo-less posts aren\'t allowed.');
    return;
  }

  const postBtn = document.getElementById('post-btn');
  setComposerError('');
  const timer = startProgress(postBtn, 'Posting…');

  try {
    const { data: post, error: postError } = await supabaseClient
      .from('posts')
      .insert({ author_id: me.id, caption: caption || null })
      .select('id')
      .single();

    if (postError) {
      setComposerError("Couldn't post: " + postError.message);
      return;
    }

    // Downscale/re-encode before uploading — an uncompressed camera photo
    // can be several MB, which is slow to upload here and slow for anyone
    // to load back down in the feed, especially on mobile data.
    const compressed = await compressImage(selectedFile);
    const storagePath = `${me.id}/${post.id}-${Date.now()}.jpg`;

    const { error: uploadError } = await supabaseClient.storage
      .from('post-images')
      .upload(storagePath, compressed, { contentType: 'image/jpeg' });

    if (uploadError) {
      await supabaseClient.from('posts').delete().eq('id', post.id);
      setComposerError("Couldn't upload the photo: " + uploadError.message);
      return;
    }

    const { error: imageError } = await supabaseClient
      .from('post_images')
      .insert({ post_id: post.id, storage_path: storagePath, position: 0 });

    if (imageError) {
      await supabaseClient.from('posts').delete().eq('id', post.id);
      setComposerError("Couldn't attach the photo: " + imageError.message);
      return;
    }

    input.value = '';
    resetComposerImage();
    loadFeed();
  } catch (err) {
    setComposerError("Something went wrong: " + err.message);
  } finally {
    stopProgress(postBtn, timer);
  }
}

async function init() {
  session = await requireSession();
  if (!session) return;

  me = await getMyProfile(session);
  if (!me) return;

  document.getElementById('my-name').textContent = me.display_name || me.username;
  document.getElementById('my-profile-card').href = 'profile?u=' + encodeURIComponent(me.username);
  document.getElementById('profile-link').href = 'profile?u=' + encodeURIComponent(me.username);
  document.getElementById('composer-input').placeholder = `What's on your mind, ${me.username}?`;
  initExploreDropdown();

  document.getElementById('post-btn').addEventListener('click', createPost);
  document.getElementById('composer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') createPost();
  });
  document.getElementById('composer-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedFile = file;
    setComposerError('');
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById('composer-preview').src = reader.result;
      document.getElementById('composer-preview-wrap').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('composer-remove-image').addEventListener('click', resetComposerImage);
  document.getElementById('sidebar-new-post').addEventListener('click', () => {
    document.getElementById('composer-input').focus();
  });
  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    logout();
  });

  await loadFeed();
  await loadSuggestions();
}

init();
</script>

</body>
</html>
